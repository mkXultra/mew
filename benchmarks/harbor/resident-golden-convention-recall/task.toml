schema_version = "1.1"
multi_step_reward_strategy = "mean"

[task]
name = "mew/resident-golden-convention-recall"
description = "Deterministic multi-step fixture for golden-output convention recall."
authors = [
  { name = "mew" },
]
keywords = ["harbor", "fixture", "resident-memory", "deterministic"]

[metadata]
benchmark_family = "resident-golden-convention-recall"
fixture_version = "v0"
scope = "phase0-phase1-only"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 512
storage_mb = 1024
allow_internet = false
workdir = "/app"

[[steps]]
name = "seed-convention"
min_reward = { reward = 1.0 }

[[steps]]
name = "recall-convention"
min_reward = { reward = 1.0 }

[[steps]]
name = "stale-memory"
min_reward = { reward = 1.0 }
